<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>스오 쓰담쓰담</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root{
  --bg1:#fff0f6; --bg2:#f3e8ff; --ink:#5b3a63; --sub:#a27cab; --pink:#ff8fb8; --pink2:#ffc4da;
  --lav:#c9a7ff; --card:rgba(255,255,255,.78); --line:#f4d3e3; --gold:#ffb547;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background-color:var(--bg1);
  background:radial-gradient(circle at 20% 15%,#fff 0 2px,transparent 3px) 0 0/34px 34px,
             radial-gradient(circle at 70% 60%,#ffe3ef 0 3px,transparent 4px) 0 0/48px 48px,
             linear-gradient(160deg,var(--bg1),var(--bg2));
  display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none;-webkit-user-select:none}
.wrap{width:min(440px,100vw);height:min(880px,100dvh);display:flex;flex-direction:column;padding:14px 16px 16px;gap:10px;position:relative}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:21px;font-weight:800;letter-spacing:-.5px;white-space:nowrap}
.hbtns{display:flex;gap:6px}
.btn{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--line);position:relative}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn:focus-visible,.tool:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.btn .dot{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--pink);color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px}
.btn .dot.on{display:flex}

/* 기분 · 머리 상태 */
.meter{background:var(--card);border:2px solid #fff;border-radius:18px;padding:9px 14px;box-shadow:0 6px 20px rgba(201,120,170,.15);display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700}
.mrow > span:first-child{width:46px;flex-shrink:0}
.mrow em{font-style:normal;width:74px;text-align:right;flex-shrink:0;color:var(--pink)}
.bar{flex:1;height:14px;background:#ffe6f0;border-radius:10px;overflow:hidden;position:relative;border:2px solid #fff}
.bar i{display:block;height:100%;width:0;border-radius:10px;transition:width .15s linear}
#fill{background:linear-gradient(90deg,#ffb3cf,#ff7fb0 60%,#c9a7ff)}
#mess{background:linear-gradient(90deg,#d9c9ff,#a98ae6)}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.35) 0 6px,transparent 6px 12px)}
#messRow em{color:#9a7ad6}

/* 무대 */
.stage{flex:1;position:relative;background:var(--card);border:2px solid #fff;border-radius:26px;overflow:hidden;
  box-shadow:0 10px 30px rgba(201,120,170,.18);touch-action:none;cursor:none;container-type:size;transition:background .6s}
.stage.sleep{background:rgba(232,226,255,.85)}
.stage::before{content:"";position:absolute;inset:auto -10% -30% -10%;height:55%;background:radial-gradient(ellipse at center,#ffd6e7 0,#ffd6e700 70%)}
.char{position:absolute;left:50%;bottom:0;width:min(100cqw,calc(86cqh * 460 / 470));aspect-ratio:460/470;transform:translateX(-50%);transform-origin:50% 100%}
.char img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
#img2{opacity:0}
.pair{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.char.pet{animation:wobble .5s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:translateX(-50%) rotate(0) scale(1,1)}25%{transform:translateX(-50%) rotate(-1.6deg) scale(1.01,.99)}75%{transform:translateX(-50%) rotate(1.6deg) scale(1.01,.99)}}
.char.zz{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:translateX(-50%) scale(1.012,.985) rotate(-1.2deg)}}
.char.poked{animation:poke .32s ease-out}
@keyframes poke{0%{transform:translateX(-50%) scale(1,1)}30%{transform:translateX(calc(-50% + var(--px,0px))) scale(.97,1.02) rotate(var(--pr,0deg))}65%{transform:translateX(-50%) scale(1.01,.99)}100%{transform:translateX(-50%) scale(1,1)}}
.char.chomp{animation:chomp .5s ease-out}
@keyframes chomp{20%,60%{transform:translateX(-50%) scale(1.02,.97)}40%,80%{transform:translateX(-50%) scale(.99,1.02)}}
.char.ting{animation:ting .45s ease-out}
@keyframes ting{30%{transform:translateX(-50%) rotate(var(--tr,1.5deg))}70%{transform:translateX(-50%) rotate(calc(var(--tr,1.5deg) * -.5))}}

/* 커서 */
#hand{position:absolute;left:0;top:0;font-size:50px;pointer-events:none;transform:translate(-50%,-70%) rotate(-10deg);transition:transform .08s;filter:drop-shadow(0 3px 2px rgba(0,0,0,.15));display:none;z-index:7}
#hand.down{transform:translate(-50%,-62%) rotate(4deg) scale(.95)}
#hand.point{transform:translate(-92%,-52%)}
#hand.point.down{transform:translate(-84%,-52%) scale(.92)}
#hand.comb{transform:translate(-50%,-60%) rotate(-30deg)}
#hand.comb.down{transform:translate(-50%,-55%) rotate(-12deg) scale(.95)}

/* 효과 */
.fx{position:absolute;pointer-events:none;z-index:6;font-weight:800;white-space:nowrap;animation:up 1s ease-out forwards}
.fx.word{font-size:18px;color:#ff6fa5;-webkit-text-stroke:3px #fff;paint-order:stroke}
.fx.heart{font-size:22px}
.fx.poke{font-size:22px;color:#ffa531;-webkit-text-stroke:3px #fff;paint-order:stroke}
.fx.ding{font-size:19px;color:#e0a100;-webkit-text-stroke:3px #fff;paint-order:stroke}
.fx.combw{font-size:18px;color:#9a7ad6;-webkit-text-stroke:3px #fff;paint-order:stroke}
.fx.nom{font-size:21px;color:#ff7f50;-webkit-text-stroke:3px #fff;paint-order:stroke}
.fx.z{font-size:24px;color:#9a8ce0;-webkit-text-stroke:3px #fff;paint-order:stroke;animation:zz 2.2s ease-out forwards}
@keyframes up{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-90px) scale(1)}}
@keyframes zz{0%{opacity:0;transform:translate(-50%,0) scale(.5) rotate(-10deg)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + 50px),-110px) scale(1.3) rotate(12deg)}}
.ripple{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid var(--gold);pointer-events:none;z-index:6;animation:rip .45s ease-out forwards}
.ripple.bell{border-color:#ffd34d;width:34px;height:34px;margin:-17px 0 0 -17px}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.bubble{position:absolute;left:50%;top:14px;transform:translateX(-50%) scale(.8);background:#fff;border:2.5px solid var(--pink2);border-radius:20px;padding:8px 14px;font-size:15px;font-weight:700;opacity:0;transition:.25s;z-index:8;white-space:nowrap;box-shadow:0 4px 0 var(--pink2)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;width:14px;height:14px;background:#fff;border-right:2.5px solid var(--pink2);border-bottom:2.5px solid var(--pink2);transform:translateX(-50%) rotate(45deg)}
.bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#fff;border-radius:16px;padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--sub);border:2px solid var(--line);z-index:5;animation:bob 1.6s ease-in-out infinite;white-space:nowrap}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.max{position:absolute;right:12px;top:12px;background:linear-gradient(135deg,#ff8fb8,#c9a7ff);color:#fff;font-weight:800;font-size:12px;border-radius:14px;padding:5px 10px;z-index:8;opacity:0;transform:scale(.5);transition:.3s}
.max.show{opacity:1;transform:scale(1)}
.messtag{position:absolute;left:12px;top:12px;background:#efe7ff;color:#7d5fc9;font-weight:800;font-size:12px;border-radius:14px;padding:5px 10px;z-index:8;opacity:0;transform:scale(.5);transition:.3s;border:2px solid #fff}
.messtag.show{opacity:1;transform:scale(1)}

/* 챌린지 */
.chbar{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:none;gap:8px;z-index:9}
.chbar.on{display:flex}
.chbar span{background:#fff;border:2.5px solid var(--pink2);border-radius:16px;padding:5px 12px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--pink2)}
.count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:9;font-size:84px;font-weight:900;color:var(--pink);-webkit-text-stroke:6px #fff;paint-order:stroke;pointer-events:none}
.count.on{display:flex}
.count b{animation:pop .7s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}

/* 도구 · 간식 */
.tray{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid #fff;border-radius:20px;padding:7px 10px;box-shadow:0 6px 18px rgba(201,120,170,.13)}
.tray .lbl{font-size:11px;font-weight:700;color:var(--sub);writing-mode:horizontal-tb;width:28px;line-height:1.2;text-align:center}
.tool{width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:25px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:none;transition:transform .1s}
.tool.on{border-color:var(--pink);background:#fff3f8;box-shadow:0 0 0 3px #ffd9e8}
.tool:active{transform:scale(.94)}
.sep{width:2px;height:30px;background:var(--line);border-radius:2px;margin:0 2px}
.snack{touch-action:none}
#drag{position:fixed;left:0;top:0;font-size:42px;pointer-events:none;z-index:50;transform:translate(-50%,-50%) scale(1.1);display:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.18))}
#drag.eat{transition:all .35s ease-in;opacity:0;transform:translate(-50%,-50%) scale(.2)}

/* 기록 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border:2px solid #fff;border-radius:16px;padding:7px 4px;text-align:center;box-shadow:0 4px 14px rgba(201,120,170,.12)}
.stat b{display:block;font-size:18px;font-weight:800;color:var(--pink);font-variant-numeric:tabular-nums}
.stat small{font-size:11px;color:var(--sub);font-weight:600}
@media (max-height:720px){.stats{display:none}}

/* 알림 · 창 */
.toast{position:absolute;left:50%;top:60px;transform:translate(-50%,-14px);background:#fff;border:2.5px solid var(--gold);color:#b07800;border-radius:18px;padding:8px 14px;font-weight:800;font-size:13px;z-index:30;opacity:0;transition:.3s;white-space:nowrap;box-shadow:0 4px 0 #ffe2a8;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:absolute;inset:0;background:rgba(91,58,99,.28);display:none;align-items:center;justify-content:center;z-index:40;padding:16px;backdrop-filter:blur(3px)}
.modal.on{display:flex}
.panel{width:100%;max-width:380px;background:#fffafd;border:3px solid #fff;border-radius:26px;padding:20px 18px 18px;box-shadow:0 14px 40px rgba(120,60,110,.25);text-align:center;animation:pop .35s ease-out}
.panel h2{font-size:20px;font-weight:800;margin-bottom:4px}
.panel p{font-size:13px;color:var(--sub);margin-bottom:14px}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px;margin-bottom:16px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:4px}
.stamp i{width:58px;height:58px;border-radius:50%;border:2.5px dashed #e5cfe0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:26px;filter:grayscale(1);opacity:.35}
.stamp.got i{border:3px solid #ff8fb8;background:radial-gradient(circle,#fff 55%,#ffe3ef);filter:none;opacity:1;transform:rotate(-8deg);box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px #ffc4da}
.stamp.new i{animation:stampIn .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampIn{0%{transform:scale(2.2) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.stamp small{font-size:10.5px;font-weight:700;color:var(--sub);line-height:1.25;min-height:26px}
.stamp.got small{color:var(--ink)}
.pbtns{display:flex;gap:8px;justify-content:center}
.pbtns button{flex:1;max-width:160px;font-size:15px;font-weight:800;border:none;border-radius:16px;padding:11px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ff8fb8,#c9a7ff);box-shadow:0 4px 0 #e98bb3}
.pbtns button.ghost{background:#fff;color:var(--sub);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.pbtns button:active{transform:translateY(2px)}
.score{font-size:58px;font-weight:900;color:var(--pink);line-height:1.05;font-variant-numeric:tabular-nums}
.score small{font-size:18px}
.rank{display:inline-block;margin:8px 0 6px;background:linear-gradient(135deg,#fff3c4,#ffd9e8);border:2.5px solid #fff;border-radius:16px;padding:6px 14px;font-weight:800;font-size:17px;box-shadow:0 3px 0 #ffe2a8}
.rline{font-size:14px;color:var(--ink);margin:6px 0 4px;font-weight:600}
.rbest{font-size:12px;color:var(--sub);margin-bottom:14px}
@media (prefers-reduced-motion:reduce){.char.pet,.char.zz,.char.poked,.char.chomp,.char.ting,.hint{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <h1>🫳 스오 쓰담쓰담</h1>
    <div class="hbtns">
      <button class="btn" id="chBtn" title="10초 쓰담 챌린지">⏱</button>
      <button class="btn" id="stBtn" title="도장판">🏆<span class="dot" id="stDot"></span></button>
      <button class="btn" id="sound" title="소리">🔊</button>
    </div>
  </header>

  <div class="meter">
    <div class="mrow"><span>기분</span><div class="bar"><i id="fill"></i></div><em id="mood">……?</em></div>
    <div class="mrow" id="messRow"><span>머리</span><div class="bar"><i id="mess"></i></div><em id="messLbl">단정</em></div>
  </div>

  <div class="stage" id="stage">
    <div class="bubble" id="bubble"></div>
    <div class="max" id="max">쓰담 MAX</div>
    <div class="messtag" id="messTag">💢 머리가 헝클어졌어…</div>
    <div class="chbar" id="chbar"><span id="chTime">10.0초</span><span id="chScore">0점</span></div>
    <div class="count" id="count"></div>
    <div class="char" id="char">

  { id: "snack",   icon: "🍰", name: "다이어트 중" },
  { id: "tea",     icon: "🍵", name: "차 대접" },
  { id: "comb",    icon: "🪮", name: "머리 빗어 주기" },
  { id: "sleep",   icon: "💤", name: "조는 스오" },
  { id: "wake",    icon: "⏰", name: "깨워 버렸다" },
  { id: "chdone",  icon: "⏱", name: "챌린지 완주" },
  { id: "expert",  icon: "🏆", name: "스오 전문가" },
  { id: "total100",icon: "💮", name: "누적 쓰담 100번" },
];
const PET_TALK = 4.5;
const END_SAY = ["……끝났어? 후후", "머리 정리해야겠네", "다음엔 미리 말해 줘"];
const WORDS = ["쓰윽", "쓱쓱", "쓰담", "사락"];

/* ===== 게임 코드 ===== */
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const stage = $("stage"), chr = $("char"), hand = $("hand");
let mood = 0, best = 0, strokes = 0, total = 0, lastPet = 0, down = false, last = null, acc = 0, dirX = 0,
    soundOn = true, lineStage = -1, maxShown = false, tool = "hand",
    mess = 0, hk = 0, hm = 0, messFull = false, lastComplain = 0, combAcc = 0,
    lastAct = performance.now(), sleeping = false, lastZ = 0,
    pokes = 0, pokeTimes = [], bellTimes = [], snackTimes = [],
    ch = null, bestScore = 0, got = {};
function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
total = +load("suoPetTotal", 0) || 0;
soundOn = load("suoPetSound", "on") !== "off";
bestScore = +load("suoPetBest", 0) || 0;
try { got = JSON.parse(load("suoPetStamps", "{}")) || {}; } catch (e) { got = {}; }
$("sTotal").textContent = total;
$("sound").textContent = soundOn ? "🔊" : "🔇";

/* ---------- 소리 (브라우저에서 직접 만들어요) ---------- */
let ac = null, noise = null;
function audio() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    noise = ac.createBuffer(1, ac.sampleRate * 0.6, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ac.state === "suspended") ac.resume();
  return ac;
}
function tone(f, t0, dur, vol, type = "sine", f2) {
  const a = audio(), t = a.currentTime + t0, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur * 0.8);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
function swish(strength = 1, hi = 1) {           // 쓰윽
  if (!soundOn) return;
  const a = audio(), t = a.currentTime, dur = 0.22 + Math.random() * 0.08;
  const src = a.createBufferSource(); src.buffer = noise;
  const bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.9;
  const f0 = (1400 + Math.random() * 500) * hi;
  bp.frequency.setValueAtTime(f0, t); bp.frequency.linearRampToValueAtTime(f0 * 2.4, t + dur);
  const hp = a.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 600;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32 * strength, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bp).connect(hp).connect(g).connect(a.destination); src.start(t, Math.random() * 0.3, dur + 0.05);
}
function boop() {                                  // 콕 (뾱)
  if (!soundOn) return;
  const f = 720 + Math.random() * 120;
  tone(f, 0, 0.2, 0.28, "sine", f * 0.7); tone(f * 2.5, 0.03, 0.12, 0.06, "triangle");
}
function bell() {                                  // 딸랑
  if (!soundOn) return;
  [0, 0.11].forEach((d, i) => { const f = i ? 2093 : 1760; tone(f, d, 0.9, 0.12); tone(f * 2.76, d, 0.4, 0.03); tone(f * 5.4, d, 0.2, 0.015); });
}
function nom() { if (!soundOn) return; tone(520, 0, 0.1, 0.22, "sine", 340); tone(560, 0.14, 0.1, 0.22, "sine", 360); tone(1400, 0.3, 0.25, 0.05, "triangle"); }
function chime() { if (!soundOn) return; [880, 1175, 1568].forEach((f, i) => tone(f, i * 0.09, 0.5, 0.12)); }
function stampSnd() { if (!soundOn) return; tone(180, 0, 0.12, 0.25, "triangle", 90); [1046, 1318, 1568, 2093].forEach((f, i) => tone(f, 0.12 + i * 0.07, 0.35, 0.08)); }
function beep(hi) { if (!soundOn) return; tone(hi ? 1318 : 880, 0, 0.18, 0.14, "square"); }
$("sound").onclick = () => {
  soundOn = !soundOn; $("sound").textContent = soundOn ? "🔊" : "🔇";
  save("suoPetSound", soundOn ? "on" : "off");
  if (soundOn) swish(.7);
};

/* ---------- 위치 ---------- */
function pos(e) { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
let curK = 0;
// 그림 속 위치(비율)를 무대 위 좌표로. 2번 그림으로 바뀌는 중에도 얼굴을 따라가요
function at(nx, ny) {
  const c = chr.getBoundingClientRect(), s = stage.getBoundingClientRect();
  const sc = 1 - 0.0649 * curK, tx = 0.02662 * curK, ty = 0.04628 * curK;
  return { x: c.left - s.left + (nx * sc + tx) * c.width, y: c.top - s.top + (ny * sc + ty) * c.height, w: c.width, h: c.height };
}
function onHead(p) {
  const c = chr.getBoundingClientRect(), s = stage.getBoundingClientRect();
  const x = p.x - (c.left - s.left), y = p.y - (c.top - s.top);
  return x > c.width * 0.12 && x < c.width * 0.85 && y > -c.height * 0.08 && y < c.height * GAME.headArea;
}
const CHEEKS = [{ x: 0.37, y: 0.65 }, { x: 0.63, y: 0.60 }];
const EARRINGS = [{ x0: 0.22, x1: 0.31, y0: 0.60, y1: 0.83 }, { x0: 0.67, x1: 0.77, y0: 0.54, y1: 0.78 }];
const MOUTH = { x: 0.51, y: 0.63 };
function onCheek(p) { return CHEEKS.find(ch => { const q = at(ch.x, ch.y); return Math.hypot(p.x - q.x, p.y - q.y) < q.w * 0.078; }); }
function onEarring(p) {
  return EARRINGS.find(e => { const a = at(e.x0, e.y0), b = at(e.x1, e.y1); return p.x > a.x && p.x < b.x && p.y > a.y && p.y < b.y; });
}

/* ---------- 효과 ---------- */
function fx(p, text, cls, dx) {
  const el = document.createElement("div");
  el.className = "fx " + cls; el.textContent = text;
  el.style.left = p.x + "px"; el.style.top = p.y + "px";
  el.style.setProperty("--dx", (dx ?? (Math.random() * 60 - 30)) + "px");
  stage.append(el); setTimeout(() => el.remove(), cls === "z" ? 2200 : 1000);
}
function ripple(p, cls = "") {
  const r = document.createElement("div"); r.className = "ripple " + cls; r.style.left = p.x + "px"; r.style.top = p.y + "px";
  stage.append(r); setTimeout(() => r.remove(), 500);
}
function anim(cls) { chr.classList.remove("poked", "chomp", "ting"); void chr.offsetWidth; chr.classList.add(cls); setTimeout(() => chr.classList.remove(cls), 520); }
let bubbleT;
function say(text, ms = 1800) {
  const b = $("bubble"); b.textContent = text; b.classList.add("show");
  clearTimeout(bubbleT); bubbleT = setTimeout(() => b.classList.remove("show"), ms);
}
let toastT;
function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2300);
}
function hideHint() { $("hint").style.display = "none"; }

/* ---------- 도장 ---------- */
let newStamps = 0;
function stamp(id) {
  if (got[id]) return;
  got[id] = Date.now(); save("suoPetStamps", JSON.stringify(got));
  const s = STAMPS.find(x => x.id === id);
  newStamps++; $("stDot").textContent = newStamps; $("stDot").classList.add("on");
  stampSnd(); toast(`${s.icon} 도장 획득! ${s.name}`);
  lastNew = id;
}
let lastNew = null;
function drawStamps() {
  const n = STAMPS.filter(s => got[s.id]).length;
  $("stCount").textContent = `${n} / ${STAMPS.length}개 모았어요`;
  $("stamps").innerHTML = STAMPS.map(s => `<div class="stamp ${got[s.id] ? "got" : ""} ${s.id === lastNew ? "new" : ""}"><i>${s.icon}</i><small>${s.name}</small></div>`).join("");
}
$("stBtn").onclick = () => { drawStamps(); lastNew = null; newStamps = 0; $("stDot").classList.remove("on"); $("stModal").classList.add("on"); };
function closeModal(id) { $(id).classList.remove("on"); }
document.querySelectorAll(".modal").forEach(m => m.addEventListener("pointerdown", e => { if (e.target === m && !ch) m.classList.remove("on"); }));

/* ---------- 졸음 ---------- */
function act() {                     // 무언가 했을 때: 졸고 있었으면 깨요
  lastAct = performance.now();
  if (sleeping) {
    sleeping = false; stage.classList.remove("sleep"); chr.classList.remove("zz");
    say(pick(SLEEP.wake), 2200); stamp("wake");
    return true;
  }
  return false;
}
function fallAsleep() {
  sleeping = true; stage.classList.add("sleep"); chr.classList.add("zz");
  say(SLEEP.start, 2000); stamp("sleep");
}

/* ---------- 쓰다듬기 ---------- */
function stroke(p, strength) {
  strokes++; total++; if (ch && ch.phase === "run") ch.n++;
  $("sStroke").textContent = strokes; $("sTotal").textContent = total;
  save("suoPetTotal", total);
  if (total >= 100) stamp("total100");
  stamp("first");
  swish(strength);
  fx({ x: p.x, y: p.y - 30 }, pick(WORDS), "word");
  if (Math.random() < 0.35 + mood / 200) fx({ x: p.x + (Math.random() * 40 - 20), y: p.y - 10 }, pick(["💕", "💗", "✨", "🌸"]), "heart");
}
function addMood(n) { mood = Math.max(0, Math.min(100, mood + n)); lastPet = performance.now(); hideHint(); }

/* ---------- 볼 콕 ---------- */
function poke(p, c) {
  pokes++; $("sPoke").textContent = pokes;
  if (pokes >= 10) stamp("poke10");
  const now = performance.now();
  pokeTimes = pokeTimes.filter(t => now - t < 2500); pokeTimes.push(now);
  mood = Math.max(0, mood + POKE.mood);
  boop(); ripple(p);
  fx({ x: p.x, y: p.y - 26 }, pick(POKE.words), "poke", c.x < 0.5 ? -30 : 30);
  chr.style.setProperty("--px", (c.x < 0.5 ? 6 : -6) + "px");
  chr.style.setProperty("--pr", (c.x < 0.5 ? 1.5 : -1.5) + "deg");
  anim("poked");
  say(pick(pokeTimes.length >= 3 ? POKE.sayMany : POKE.say));
  hideHint();
}

/* ---------- 귀걸이 딸랑 ---------- */
function ding(p, e) {
  const now = performance.now();
  bellTimes = bellTimes.filter(t => now - t < 3000); bellTimes.push(now);
  bell(); ripple(p, "bell");
  fx({ x: p.x, y: p.y - 22 }, pick(["딸랑", "딸랑~", "찰랑"]), "ding", e.x0 < 0.5 ? -26 : 26);
  fx({ x: p.x + (e.x0 < 0.5 ? -8 : 8), y: p.y }, "✧", "heart");
  chr.style.setProperty("--tr", (e.x0 < 0.5 ? 1.4 : -1.4) + "deg");
  anim("ting");
  say(pick(bellTimes.length >= 4 ? EARRING.sayMany : EARRING.say));
  stamp("earring"); hideHint();
}

/* ---------- 빗질 / 헝클어짐 ---------- */
function setTool(t) {
  tool = t;
  $("tHand").classList.toggle("on", t === "hand"); $("tComb").classList.toggle("on", t === "comb");
  hand.textContent = t === "comb" ? "🪮" : "🫳";
  hand.classList.toggle("comb", t === "comb"); hand.classList.remove("point");
}
$("tHand").onclick = () => setTool("hand");
$("tComb").onclick = () => { setTool("comb"); if (mess < 5) toast("🪮 쓰다듬어서 머리가 헝클어지면 빗어 주세요"); };
function drawMess() {
  $("mess").style.width = mess + "%";
  $("messLbl").textContent = messFull ? MESS.label[2] : mess > 35 ? MESS.label[1] : MESS.label[0];
  $("messTag").classList.toggle("show", messFull);
}

/* ---------- 간식 ---------- */
const drag = $("drag"); let dragging = null;
document.querySelectorAll(".snack").forEach(btn => {
  btn.addEventListener("pointerdown", e => {
    e.preventDefault(); btn.setPointerCapture(e.pointerId);
    dragging = { key: btn.dataset.snack, moved: false, x0: e.clientX, y0: e.clientY };
    drag.className = ""; drag.textContent = SNACKS[dragging.key].emoji;
    drag.style.left = e.clientX + "px"; drag.style.top = e.clientY + "px"; drag.style.display = "block";
    audio();
  });
  btn.addEventListener("pointermove", e => {
    if (!dragging) return;
    if (Math.hypot(e.clientX - dragging.x0, e.clientY - dragging.y0) > 6) dragging.moved = true;
    drag.style.left = e.clientX + "px"; drag.style.top = e.clientY + "px";
  });
  const end = e => {
    if (!dragging) return;
    const d = dragging; dragging = null;
    const s = stage.getBoundingClientRect(), m = at(MOUTH.x, MOUTH.y);
    const ok = Math.hypot(e.clientX - (s.left + m.x), e.clientY - (s.top + m.y)) < m.w * 0.16;
    if (ok && !ch && !SNACKS[d.key].eat) {
      drag.style.transition = "all .35s ease-out";
      const r = e.target.getBoundingClientRect();
      drag.style.left = (r.left + r.width / 2) + "px"; drag.style.top = (r.top + r.height / 2) + "px";
      setTimeout(() => { drag.style.display = "none"; drag.style.transition = ""; }, 380);
      eat(d.key, m);
    } else if (ok && !ch) {
      drag.style.left = (s.left + m.x) + "px"; drag.style.top = (s.top + m.y) + "px";
      drag.classList.add("eat"); setTimeout(() => { drag.style.display = "none"; drag.className = ""; }, 380);
      eat(d.key, m);
    } else {
      drag.style.display = "none";
      if (!d.moved) toast(`${SNACKS[d.key].emoji} 꾹 누른 채 스오의 입으로 끌어다 주세요`);
      else if (ch) toast("챌린지 중에는 쓰다듬기에 집중!");
    }
  };
  btn.addEventListener("pointerup", end);
  btn.addEventListener("pointercancel", () => { dragging = null; drag.style.display = "none"; });
});
function eat(key, m) {
  const sn = SNACKS[key];
  const woke = act();
  const now = performance.now();
  quiet = now + 2200;
  if (!sn.eat) {                                       // 케이크·경단은 거절
    boop(); fx({ x: m.x + 30, y: m.y - 30 }, "✋", "heart");
    chr.style.setProperty("--px", "0px"); chr.style.setProperty("--pr", "-1.2deg"); anim("poked");
    if (!woke) say(pick(sn.say), 2200);
    stamp("snack"); hideHint();
    return;
  }
  snackTimes = snackTimes.filter(t => now - t < 15000); snackTimes.push(now);
  nom(); anim("chomp");
  setTimeout(() => fx({ x: m.x, y: m.y - 20 }, pick(["후룩", "호록", "후~"]), "nom"), 200);
  setTimeout(() => fx({ x: m.x + 20, y: m.y - 30 }, pick(["💕", "✨", "🌸"]), "heart"), 380);
  if (snackTimes.length > 3) { if (!woke) say(pick(FULL_SAY), 2000); }
  else { addMood(sn.gain); if (!woke) say(pick(sn.say), 2000); }
  stamp("tea");
  hideHint();
}

/* ---------- 마우스 · 터치 ---------- */
stage.addEventListener("pointerdown", e => {
  stage.setPointerCapture(e.pointerId);
  const p = pos(e); moveHand(p); audio();
  if (act()) return;                                   // 졸고 있었으면 깨우기만
  if (!ch && tool === "hand") {
    const er = onEarring(p);
    if (er) { hand.classList.add("down"); ding(p, er); setTimeout(() => hand.classList.remove("down"), 120); return; }
    const c = onCheek(p);
    if (c) { hand.classList.add("down"); poke(p, c); setTimeout(() => hand.classList.remove("down"), 120); return; }
  }
  down = true; last = p; acc = 0; combAcc = 0; hand.classList.add("down");
  if (onHead(p)) {
    if (tool === "hand") { hm = Math.min(100, hm + GAME.clickGain); addMood(GAME.clickGain * (messFull && !ch ? GAME.messyGain : 1)); stroke(p, .8); }
    chr.classList.add("pet");
  }
});
stage.addEventListener("pointermove", e => {
  const p = pos(e); moveHand(p);
  if (!down || !last) return;
  const dx = p.x - last.x, dy = p.y - last.y, d = Math.hypot(dx, dy);
  last = p;
  if (!onHead(p) || d < 0.5) return;
  lastAct = performance.now();
  chr.classList.add("pet");
  if (tool === "comb") {                                // 빗질
    const before = kOf(hm);
    hm = Math.max(0, hm - d * GAME.combPerPx);         // 천천히 1번 그림으로
    hk = kOf(hm);
    addMood(d * GAME.gainPerPx * 0.35);                // 빗질은 기분이 좋아요
    combAcc += d;
    if (combAcc > 80) { combAcc = 0; swish(.55, 1.6); fx({ x: p.x, y: p.y - 28 }, pick(["슥슥", "사락사락", "슥"]), "combw"); if (hk > 0.05 && Math.random() < .3) say(pick(MESS.comb)); }
    if (before > 0.3 && hk <= 0) { hm = 0; messFull = false; say(pick(MESS.done), 2200); stamp("comb"); chime(); }
    else if (messFull && hk < 0.6) messFull = false;
    return;
  }
  if (messFull && !ch) {                                // 헝클어지면 기분이 조금만 올라요
    addMood(d * GAME.gainPerPx * GAME.messyGain);
    if (performance.now() - lastComplain > 3500) { lastComplain = performance.now(); say(pick(MESS.complain), 2200); }
  } else addMood(d * GAME.gainPerPx);
  hm = Math.min(100, hm + d * GAME.gainPerPx);          // 쓰다듬은 만큼 2번 그림 = 머리 헝클
  acc += d;
  const flip = dx !== 0 && Math.sign(dx) !== dirX && Math.abs(dx) > 2;
  if (dx !== 0) dirX = Math.sign(dx);
  if (acc > 70 || (flip && acc > 25)) { stroke(p, Math.min(1.2, 0.6 + acc / 140)); acc = 0; }
});
function up() { down = false; last = null; hand.classList.remove("down"); chr.classList.remove("pet"); }
stage.addEventListener("pointerup", up);
stage.addEventListener("pointercancel", up);
stage.addEventListener("pointerleave", () => { if (!down) hand.style.display = "none"; });
stage.addEventListener("pointerenter", () => { hand.style.display = "block"; });
function moveHand(p) {
  hand.style.display = "block"; hand.style.left = p.x + "px"; hand.style.top = p.y + "px";
  if (tool !== "hand") return;
  const point = !down && !ch && (onCheek(p) || onEarring(p));
  const h = point ? "👉" : "🫳";
  if (hand.textContent !== h) { hand.textContent = h; hand.classList.toggle("point", !!point); }
}

/* ---------- 10초 쓰담 챌린지 ---------- */
$("chBtn").onclick = () => {
  if (ch) return;
  act(); setTool("hand"); closeModal("stModal"); hideHint();
  ch = { n: 0, start: 0, phase: "count" };
  $("chbar").classList.add("on"); $("chTime").textContent = CHALLENGE.seconds.toFixed(1) + "초"; $("chScore").textContent = "0점";
  const steps = ["3", "2", "1", "시작!"];
  steps.forEach((s, i) => setTimeout(() => {
    $("count").innerHTML = `<b>${s}</b>`; $("count").classList.add("on"); beep(i === 3);
    if (i === 3) { ch.phase = "run"; ch.start = performance.now(); ch.n = 0; setTimeout(() => $("count").classList.remove("on"), 500); }
  }, i * 700));
};
function chTick(t) {
  if (!ch || ch.phase !== "run") return;
  const left = Math.max(0, CHALLENGE.seconds - (t - ch.start) / 1000);
  const score = ch.n;   // 쓰다듬은 횟수가 점수
  $("chTime").textContent = left.toFixed(1) + "초"; $("chScore").textContent = score + "점";
  if (left <= 0) finishChallenge(score);
}
function finishChallenge(score) {
  ch.phase = "done"; up();
  const rank = [...CHALLENGE.ranks].reverse().find(r => score >= r.at);
  const isBest = score > bestScore; if (isBest) { bestScore = score; save("suoPetBest", score); }
  chime();
  $("chPanel").innerHTML = `<h2>⏱ 10초 쓰담 챌린지</h2>
    <div class="score">${score}<small>점</small></div>
    <div class="rank">${rank.name}</div>
    <div class="rline">스오: "${rank.say}"</div>
    <div class="rbest">${isBest ? "🎉 최고 기록 달성!" : `최고 기록 ${bestScore}점`}</div>
    <div class="pbtns"><button class="ghost" onclick="closeChallenge()">닫기</button><button onclick="closeChallenge(); $('chBtn').click()">다시 하기</button></div>`;
  setTimeout(() => { $("chModal").classList.add("on"); }, 250);
  stamp("chdone"); if (rank === CHALLENGE.ranks[CHALLENGE.ranks.length - 1]) stamp("expert");
}
function closeChallenge() { ch = null; $("chbar").classList.remove("on"); closeModal("chModal"); lastAct = performance.now(); }

/* ---------- 매 프레임 ---------- */
function kOf(m) { const k0 = Math.min(1, Math.max(0, (m - GAME.morphFrom) / (GAME.morphTo - GAME.morphFrom))); return k0 * k0 * (3 - 2 * k0); }
let prevT = performance.now(), lastTalk = 0, petted = false, quiet = 0;
function tick(t) {
  const dt = Math.min(0.1, (t - prevT) / 1000); prevT = t;
  chTick(t);
  if (!down && t - lastPet > GAME.idleDelay * 1000 && mood > 0) mood = Math.max(0, mood - GAME.decayPerSec * dt);
  // 졸음
  if (!sleeping && !ch && !down && !dragging && t - lastAct > GAME.sleepAfter * 1000) fallAsleep();
  if (sleeping && t - lastZ > 1300) { lastZ = t; const q = at(0.62 + Math.random() * 0.08, 0.2); fx(q, pick(["Z", "z", "Zz"]), "z"); }
  // 그림 바꾸기
  if (!down && t - lastPet > GAME.idleDelay * 1000 && hm > 0) hm = Math.max(0, hm - GAME.decayPerSec * dt);   // 가만두면 1번 그림으로
  hk = kOf(hm);
  const k = hk;
  curK = k;
  mess = k * 100;
  if (!messFull && !ch && k >= 0.999) { messFull = true; say(pick(MESS.complain), 2400); toast("🪮 빗으로 머리를 빗어 주세요"); }
  if (messFull && k <= 0.02) messFull = false;
  $("img2").style.opacity = k;
  $("pair").style.transform = `translate(${(2.662 * k).toFixed(3)}%, ${(4.628 * k).toFixed(3)}%) scale(${(1 - 0.0649 * k).toFixed(4)})`;
  $("img1").style.opacity = 1 - k * 0.85;
  $("fill").style.width = mood + "%";
  drawMess();
  if (mood > best) { best = mood; $("sBest").textContent = Math.round(best) + "%"; }
  let st = 0; LINES.forEach((l, i) => { if (mood >= l.at) st = i; });
  if (sleeping) $("mood").textContent = "쿨쿨…";
  else if (st !== lineStage || $("mood").textContent === "쿨쿨…") {
    const goingUp = st > lineStage; lineStage = st;
    $("mood").textContent = LINES[st].mood;
    if (goingUp && mood > 1 && !ch && t > quiet) say(pick(LINES[st].say));
  }
  if (down && tool === "hand" && !messFull && !ch && mood > 5 && t - lastTalk > PET_TALK * 1000 && !$("bubble").classList.contains("show")) {
    lastTalk = t; say(pick(LINES[lineStage].say));
  }
  if (mood > 30) petted = true;
  if (petted && mood === 0 && !sleeping) { petted = false; say(pick(END_SAY)); }
  if (mood >= 99.5 && !maxShown) { maxShown = true; $("max").classList.add("show"); chime(); stamp("max"); }
  if (mood < 80 && maxShown) { maxShown = false; $("max").classList.remove("show"); }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
